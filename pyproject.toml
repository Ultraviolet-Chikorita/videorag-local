[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longvideo-rag"
version = "0.1.0"
description = "Local-first multimodal retrieval and question answering for long-form video."
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.0.3",
]

[project.optional-dependencies]
vision = [
  "pillow>=10",
  "torch>=2.2",
  "transformers>=4.45",
]
demo = [
  "yt-dlp>=2024.0",
]

[project.urls]
Repository = "https://github.com/Ultraviolet-Chikorita/videorag-local"

[project.scripts]
longvideo-rag = "longvideo_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
longvideo_rag = ["web_static/*"]
