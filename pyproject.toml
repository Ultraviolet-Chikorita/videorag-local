[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longvideo-rag"
version = "0.1.0"
description = "Metadata-first retrieval core for long-form, multi-video RAG."
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.0.3"]

[project.optional-dependencies]
vision = ["pillow>=10", "torch>=2.2", "transformers>=4.45"]

[project.scripts]
longvideo-rag = "longvideo_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
longvideo_rag = ["web_static/*"]
